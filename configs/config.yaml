# ==============================================================================
# OTTO - Multi-Objective Recommender System Configuration
# All heavy datasets, intermediate artifacts, and models live on Google Drive.
# ==============================================================================

base_dir: "/content/drive/MyDrive/OTTO"

paths:
  raw_data: "data/raw"
  sample_data: "data/sample"
  splits: "data/splits"
  candidates: "artifacts/candidates"
  features: "artifacts/features"
  models: "artifacts/models"
  submissions: "submissions"

modes:
  sample:
    sample_frac: 0.05
    history_corpus_frac: 1.0
    description: "5% validation/test sessions on 100% item graph for true Recall@20 verification"
  full:
    sample_frac: 1.0
    history_corpus_frac: 1.0
    description: "Full dataset execution for final training and Kaggle submission"

pipeline:
  seed: 42
  event_types:
    - "clicks"
    - "carts"
    - "orders"
  metric_weights:
    clicks: 0.10
    carts: 0.30
    orders: 0.60
  validation_days: 7
  top_k_candidates: 80
  top_k_predict: 20
  max_val_sessions: 350000

covisitation:
  clicks_top_k: 40
  carts_orders_top_k: 40
  buy2buy_top_k: 40
  clicks_window_hours: 24
  buy2buy_window_days: 14

lightgbm:
  objective: "lambdarank"
  metric: "ndcg"
  boosting_type: "gbdt"
  n_estimators: 600
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  early_stopping_rounds: 50
  random_state: 42
  n_jobs: -1
  verbose: -1

xgboost:
  enabled: true
  objective: "rank:ndcg"
  eval_metric: "ndcg@20"
  tree_method: "hist"
  device: "auto"
  n_estimators: 600
  learning_rate: 0.05
  max_depth: 7
  min_child_weight: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  early_stopping_rounds: 50
  random_state: 42
