# ==============================================================================
# OTTO - Multi-Objective Recommender System Configuration
# All heavy datasets, intermediate artifacts, and models live on Google Drive.
# ==============================================================================

base_dir: "/content/drive/MyDrive/OTTO"

paths:
  raw_data: "data/raw"
  sample_data: "data/sample"
  splits: "data/splits"
  candidates: "artifacts/candidates"
  features: "artifacts/features"
  models: "artifacts/models"
  submissions: "submissions"

modes:
  sample:
    sample_frac: 0.05
    description: "Fast 5% session sample for end-to-end pipeline verification"
  full:
    sample_frac: 1.0
    description: "Full dataset execution for final validation and submission"

pipeline:
  seed: 42
  event_types:
    - "clicks"
    - "carts"
    - "orders"
  metric_weights:
    clicks: 0.10
    carts: 0.30
    orders: 0.60
  validation_days: 7
  top_k_candidates: 50
  top_k_predict: 20

covisitation:
  clicks2clicks_top_k: 50
  carts2orders_top_k: 50
  buy2buy_top_k: 50
  time_window_hours: 24

lightgbm:
  objective: "lambdarank"
  metric: "ndcg"
  ndcg_eval_at: [20]
  boosting_type: "gbdt"
  n_estimators: 1000
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  early_stopping_rounds: 50
  random_state: 42
  n_jobs: -1
  verbose: -1
